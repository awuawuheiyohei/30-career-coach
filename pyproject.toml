[project]
name = "career-coach"
version = "0.1.0"
description = "Personal Career Coach - 4-hour daily plan + mock interview questions + progress tracking"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
career-coach = "app.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]